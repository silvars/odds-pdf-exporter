<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 420px; margin: 12px; color: #222; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  textarea { width: 100%; height: 190px; box-sizing: border-box; font: 12px ui-monospace, monospace; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  label { display: block; margin: 8px 0 3px; font-weight: 600; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  button { padding: 6px 12px; cursor: pointer; }
  #start { background: #1565c0; color: #fff; border: 0; border-radius: 4px; }
  #log { margin-top: 10px; height: 130px; overflow: auto; background: #f5f5f5; padding: 6px; white-space: pre-wrap; font: 11px ui-monospace, monospace; }
  small { color: #666; }
</style>
</head>
<body>
  <h1>Odds PDF Exporter</h1>
  <small>Abra a página da lista de jogos e cole abaixo, uma linha por jogo: <b>05. Holanda × Grécia</b></small>
  <label for="list">Lista de jogos</label>
  <textarea id="list"></textarea>
  <label for="sel">Seletor CSS extra para expandir mercados (opcional)</label>
  <input type="text" id="sel" placeholder="ex.: [class*=market-header]">
  <label><input type="checkbox" id="test"> Modo teste (só o primeiro jogo da lista)</label>
  <div class="row">
    <button id="start">Iniciar</button>
    <button id="stop">Parar</button>
    <button id="clear">Limpar log</button>
  </div>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>
</html>
